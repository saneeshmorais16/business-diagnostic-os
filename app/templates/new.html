{% extends "base.html" %}{% block body %}<main class="narrow"><p class="eyebrow">Engagement setup</p><h1>Create a diagnostic engagement</h1><form class="form card" method="post" action="/engagements"><label>Company name<input required name="company_name"></label><label>Industry<select name="industry">{% for x in ['banking','retail','hospitality','healthcare','professional services','logistics','technology','manufacturing'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Country<input name="country" value="United Kingdom"></label><label>Employees<input required type="number" min="1" name="employees"></label><label>Annual revenue (£)<input required type="number" min="1" name="annual_revenue"></label><label>Operating cost (£)<input required type="number" min="0" name="operating_cost"></label><label class="wide">Strategic objectives<textarea name="strategic_objectives"></textarea></label><label class="wide">Current challenges<textarea name="current_challenges"></textarea></label><label>Primary stakeholder<input name="primary_stakeholder" value="Executive sponsor"></label><button>Create engagement</button></form></main>{% endblock %}
